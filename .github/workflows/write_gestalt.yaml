name: Write Gestalt

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Title of the gestalt"
        required: true
      tags:
        description: "Comma-separated tags"
        required: false
      tier:
        description: "Tier (1, 2, 3...)"
        required: true
      content:
        description: "Markdown content"
        required: true

jobs:
  write-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Write gestalt file
        run: |
          mkdir -p memory/gestalts

          DATE=$(date +%F)
          TIME=$(date +%H-%M-%S)
          SLUG=$(echo "${{ github.event.inputs.title }}" | tr '[:upper:]' '[:lower:]' | sed 's/ /_/g' | sed 's/[^a-z0-9_-]//g')
          FILENAME="memory/gestalts/${DATE}T${TIME}_${SLUG}.md"

          echo "# Title: ${{ github.event.inputs.title }}" > $FILENAME
          echo "**Date:** ${DATE}T${TIME}" >> $FILENAME
          echo "**Tier:** ${{ github.event.inputs.tier }}" >> $FILENAME
          echo "**Tags:** ${{ github.event.inputs.tags }}" >> $FILENAME
          echo "" >> $FILENAME
          echo "---" >> $FILENAME
          echo "" >> $FILENAME
          echo "${{ github.event.inputs.content }}" >> $FILENAME

      - name: Show file contents
        run: |
          ls -R memory/gestalts/
          cat memory/gestalts/*.md || echo "No files created"
      
      - name: Git status check
        run: |
          git status


      - name: Commit and push
        run: |
          git config user.name "aiko-writer-bot"
          git config user.email "aiko@example.com"
          git add memory/gestalts/
          git commit -m "Add gestalt: ${{ github.event.inputs.title }}" || echo "Nothing to commit"
          git push
